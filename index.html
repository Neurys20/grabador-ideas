<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0e" />
  <meta name="description" content="Graba y organiza tus ideas de voz sin perder nada." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ideas" />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />

  <title>Grabador de Ideas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── APP SHELL ───────────────────────────────────────────────────────── -->
  <div id="app">

    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-dot"></span>
          <span class="logo-text">Ideas</span>
        </div>
        <div class="header-meta" id="headerMeta">
          <span class="session-count" id="sessionCount"></span>
        </div>
      </div>
    </header>

    <!-- ── PANEL DE GRABACIÓN ─────────────────────────────────────────── -->
    <section class="record-panel" id="recordPanel">

      <!-- Visualizador de ondas de audio -->
      <div class="waveform-container" id="waveformContainer">
        <canvas id="waveformCanvas"></canvas>
        <div class="waveform-idle" id="waveformIdle">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="23" stroke="#2a2a38" stroke-width="1.5"/>
            <path d="M18 24a6 6 0 0012 0V16a6 6 0 00-12 0v8z" stroke="#3a3a50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M14 26c0 5.52 4.48 10 10 10s10-4.48 10-10" stroke="#3a3a50" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <line x1="24" y1="36" x2="24" y2="40" stroke="#3a3a50" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- Contador de tiempo -->
      <div class="timer-block">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div class="timer-meta" id="timerMeta">Pulsa para grabar</div>
      </div>

      <!-- Indicador de segmentos -->
      <div class="segment-indicator" id="segmentIndicator" style="display:none">
        <div class="seg-dot"></div>
        <span id="segmentLabel">Segmento 1 · 0 guardados</span>
      </div>

      <!-- Botón principal -->
      <div class="record-btn-wrapper">
        <button class="record-btn" id="recordBtn" aria-label="Iniciar grabación">
          <div class="record-btn-rings">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
          </div>
          <div class="record-btn-core">
            <svg class="icon-mic" id="iconMic" width="36" height="36" viewBox="0 0 36 36" fill="none">
              <path d="M13 18a5 5 0 0010 0V10a5 5 0 00-10 0v8z" fill="white"/>
              <path d="M9 20c0 4.97 4.03 9 9 9s9-4.03 9-9" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
              <line x1="18" y1="29" x2="18" y2="33" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="icon-stop" id="iconStop" width="28" height="28" viewBox="0 0 28 28" fill="none" style="display:none">
              <rect x="6" y="6" width="16" height="16" rx="3" fill="white"/>
            </svg>
          </div>
        </button>
      </div>

      <!-- Estado del proceso (FFmpeg-like merge) -->
      <div class="processing-banner" id="processingBanner" style="display:none">
        <div class="processing-spinner"></div>
        <span id="processingLabel">Procesando grabación…</span>
      </div>

      <!-- Error de permisos -->
      <div class="perm-error" id="permError" style="display:none">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="8" stroke="#ff6b6b" stroke-width="1.4"/>
          <line x1="9" y1="5" x2="9" y2="10" stroke="#ff6b6b" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="9" cy="13" r="1" fill="#ff6b6b"/>
        </svg>
        <span id="permErrorMsg">Permiso de micrófono denegado. Habilítalo en ajustes del navegador.</span>
      </div>

    </section>

    <!-- ── DIVIDER ─────────────────────────────────────────────────────── -->
    <div class="section-divider"></div>

    <!-- ── LISTA DE GRABACIONES ───────────────────────────────────────── -->
    <section class="recordings-section">
      <div class="recordings-header" id="recordingsHeader" style="display:none">
        <h2 class="recordings-title">Grabaciones</h2>
        <button class="sort-btn" id="sortBtn" title="Ordenar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="4" y1="8" x2="12" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="6" y1="12" x2="10" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M15 20a5 5 0 0010 0V12a5 5 0 00-10 0v8z" stroke="#2a2a42" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M11 22c0 5 4 9 9 9s9-4 9-9" stroke="#2a2a42" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <p class="empty-title">Tus ideas aparecerán aquí</p>
        <p class="empty-sub">Pulsa el botón rojo para empezar</p>
      </div>

      <!-- Loading state -->
      <div class="loading-state" id="loadingState" style="display:none">
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- List -->
      <ul class="recordings-list" id="recordingsList" role="list"></ul>
    </section>

  </div><!-- /#app -->

  <!-- ── PLAYBACK BAR (aparece al reproducir) ──────────────────────────── -->
  <div class="playback-bar" id="playbackBar" style="display:none" role="complementary" aria-label="Reproductor">
    <div class="playback-info">
      <button class="playback-toggle" id="playbackToggle" aria-label="Pausar">
        <svg id="playIcon" width="20" height="20" viewBox="0 0 20 20" fill="none" style="display:none">
          <polygon points="5,3 17,10 5,17" fill="currentColor"/>
        </svg>
        <svg id="pauseIcon" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/>
          <rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/>
        </svg>
      </button>
      <div class="playback-title" id="playbackTitle">—</div>
      <button class="playback-close" id="playbackClose" aria-label="Cerrar reproductor">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="playback-progress-wrap">
      <input type="range" class="playback-slider" id="playbackSlider" min="0" max="100" value="0" />
    </div>
    <div class="playback-times">
      <span id="playbackPos">0:00</span>
      <span id="playbackDur">0:00</span>
    </div>
  </div>

  <!-- ── TOAST NOTIFICATIONS ─────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="db.js"></script>
  <script src="recorder.js"></script>
  <script src="app.js"></script>
</body>
</html>
